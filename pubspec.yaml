name: ai_voice_genie
description: AI Voice Genie - Unified multi-model AI assistant mobile app with voice dictation, vision analysis, PDF parsing, and native media downloads.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  # ── Flutter Core SDK ────────────────────────────────────────────────────────
  flutter:
    sdk: flutter
  # Official Flutter localization support for multi-language handling
  flutter_localizations:
    sdk: flutter

  # ── State Management & Architecture ─────────────────────────────────────────
  # Provider: Reactive MVVM ViewModel state propagation and dependency injection
  provider: ^6.1.2

  # ── Firebase & Cloud Infrastructure ─────────────────────────────────────────
  # Firebase Core: Firebase app initialization and platform options binding
  firebase_core: ^3.6.0
  # Firebase Auth: User session management and OAuth credential authentication
  firebase_auth: ^5.3.1
  # Cloud Firestore: User profile storage, monthly usage telemetry, and outbox sync
  cloud_firestore: ^5.4.4
  # Firebase Storage: Remote asset storage and backup for generated PDFs
  firebase_storage: ^12.4.10
  # Firebase Analytics: User telemetry and feature event logging
  firebase_analytics: ^11.3.3
  # Firebase Crashlytics: Real-time automated crash and fatal error reporting
  firebase_crashlytics: ^4.3.0

  # ── Authentication Providers ────────────────────────────────────────────────
  # Google Sign-In: Native Google OAuth sign-in flow handler
  google_sign_in: ^6.2.1

  # ── UI Icons & Vector Graphics ──────────────────────────────────────────────
  # FontAwesome: Vector brand icons for AI models (OpenAI, Gemini, Claude) & UI controls
  font_awesome_flutter: ^11.0.0

  # ── Local Storage & Encryption ──────────────────────────────────────────────
  # Hive: Zero-latency local key-value database for conversations, messages & settings
  hive: ^2.2.3
  # Hive Flutter: Platform directory initialization and box extensions for Flutter
  hive_flutter: ^1.1.0
  # Flutter Secure Storage: Hardware-backed storage (Android Keystore / iOS Keychain) for API keys
  flutter_secure_storage: ^9.2.2
  # Encrypt: AES-256 encryption and decryption utilities for confidential local data
  encrypt: ^5.0.3
  # Crypto: Cryptographic SHA-256 hashing for OAuth nonces and token verification
  crypto: ^3.0.7

  # ── Security & Screen Protection ───────────────────────────────────────────
  # No Screenshot: Enforces native OS FLAG_SECURE to block screen capture on API key screens
  no_screenshot: ^1.2.0

  # ── Networking & AI Communications ──────────────────────────────────────────
  # HTTP: REST API client for OpenAI, Gemini, and Claude model communications
  http: ^1.2.2

  # ── Voice Speech-to-Text & Text-to-Speech ───────────────────────────────────
  # Speech to Text: Device-native continuous microphone dictation engine
  speech_to_text: ^7.0.0
  # Flutter TTS: Device-native text-to-speech voice synthesis for response playback
  flutter_tts: ^4.2.0
  # Record: High-fidelity audio recording engine for voice captures
  record: ^7.1.1

  # ── File & Media Handling ───────────────────────────────────────────────────
  # File Picker: Native document picker dialog for selecting PDF files
  file_picker: ^8.1.2
  # Image Picker: Camera and gallery photo picker for multimodal vision prompts & avatars
  image_picker: ^1.1.2
  # Flutter Image Compress: Byte compression optimizing avatar uploads & vision payloads
  flutter_image_compress: ^2.4.0

  # ── Document Compilation & Viewing ──────────────────────────────────────────
  # PDF: Client-side pure-Dart binary PDF generation and layout compilation from markdown
  pdf: ^3.13.1
  # Open Filex: Platform intent launcher to open and view compiled PDFs in native document viewers
  open_filex: ^4.7.0
  # Share Plus: Native OS share sheet integration for exporting AI responses and PDF files
  share_plus: ^12.0.2

  # ── UI Components & Rendering ───────────────────────────────────────────────
  # Lottie: Vector animation renderer for splash screen animations and empty history states
  lottie: ^3.1.2
  # Shimmer: Shimmer skeleton loading effect for conversation cards and message bubbles
  shimmer: ^3.0.0
  # Flutter Markdown Plus: Rich markdown rendering for AI responses with code highlighting & tables
  flutter_markdown_plus: ^1.0.12

  # ── Platform & System Utilities ─────────────────────────────────────────────
  # UUID: Unique v4 identifier generator for local conversation and message tracking
  uuid: ^4.5.1
  # Intl: Date/time formatting, number formatting, and localization utilities
  intl: ^0.20.2
  # Connectivity Plus: Real-time network monitoring for background offline outbox sync
  connectivity_plus: ^6.1.0
  # Package Info Plus: Retrieves app version, build number, and metadata for About screen
  package_info_plus: ^8.1.1
  # URL Launcher: System intent launcher for email (mailto:) developer support links
  url_launcher: ^6.3.1
  # Path Provider: Device file system directory resolver for Hive boxes and cache storage
  path_provider: ^2.1.5
  # Permission Handler: Runtime platform permission requests for microphone and camera access
  permission_handler: ^12.0.1

dev_dependencies:
  # Flutter Test: Unit and widget testing framework
  flutter_test:
    sdk: flutter
  # Flutter Lints: Official lint rules for Flutter code quality
  flutter_lints: ^4.0.0
  # Build Runner: Code generation engine for Hive type adapters
  build_runner: ^2.4.12
  # Hive Generator: Automatically generates binary type adapters for Hive models
  hive_generator: ^2.0.1
  # Flutter Launcher Icons: Generates native app icons for Android and iOS
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # ── Typography ──────────────────────────────────────────────────────────────
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

  # ── Assets ──────────────────────────────────────────────────────────────────
  assets:
    - assets/images/
    - assets/fonts/
    - assets/lottie/
    - assets/gifs/
    - assets/legal/
